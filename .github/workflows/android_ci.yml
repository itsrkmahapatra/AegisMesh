name: Android CI Build & Export APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/AegisMesh-v1.0.0-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AegisMesh-Debug-APK
          path: app/build/outputs/apk/debug/AegisMesh-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Publish Test Release with APK Asset
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-test
          name: AegisMesh v1.0.0 Test Build
          prerelease: true
          body: |
            Official test APK build for AegisMesh (com.itsrkmahapatra.aegismesh).
            Developed by Raj Kishor Mahapatra.
            Proprietary - For Authorized Testing Use Only.
          files: app/build/outputs/apk/debug/AegisMesh-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
