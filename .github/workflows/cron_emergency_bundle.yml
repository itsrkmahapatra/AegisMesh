name: Compile Emergency Bundle CDN

on:
  schedule:
    - cron: '*/15 * * * *' # Every 15 minutes
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Emergency Bundle
        run: node scripts/compile_emergency_bundle.js

      - name: Deploy to GitHub Pages CDN
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./bundle
          destination_dir: bundle
          keep_files: true

